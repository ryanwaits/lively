version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: lively_web_1
      APP_PORT: 8080
      # v1.1 (external WS clients): PROXY_AUTH_WHITELIST: "/rooms/*"

  web:
    # Replace <digest> with the manifest-list digest from the release workflow:
    #   docker buildx imagetools inspect ghcr.io/ryanwaits/lively:0.1.0
    image: ghcr.io/ryanwaits/lively:0.1.0@sha256:<digest>
    restart: on-failure
    stop_grace_period: 30s
    user: "1000:1000"
    environment:
      PORT: 8080
      DATA_DIR: /data
    volumes:
      - ${APP_DATA_DIR}/data:/data
